databases:
  - name: nifty-predictor-db
    databaseName: nifty_predictor_db
    user: nifty_predictor_db_user
    plan: free
    region: singapore

services:
  - type: web
    name: nifty-predictor-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nifty-predictor-db
          property: connectionString
